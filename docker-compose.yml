services:
  gym-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_climbing_tracker
    ports:
      - "8501:8501"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - STREAMLIT_THEME_BASE=dark
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0

